services:
  frontend:
    image: nginx:alpine
    container_name: adavas-emu-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro

    depends_on:
      - backend


  backend:
    build: ./backend
    container_name: adavas-emu-backend
    restart: unless-stopped

    volumes:
      - ./data:/data
    
  frontend:
    image: nginx:alpine
    container_name: adavas-emu-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
      